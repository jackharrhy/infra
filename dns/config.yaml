---
providers:
  config:
    class: octodns.provider.yaml.YamlProvider
    directory: ./dns/zones
    default_ttl: 3600
    enforce_order: True

  digitalocean:
    class: octodns_digitalocean.DigitalOceanProvider
    token: env/DIGITALOCEAN_TOKEN

  # octodns-ddns uses its provider ID as the record name; '' means apex.
  # Run from Newport: the HTTP IP lookup must see its public WAN address.
  home:
    class: octodns_ddns.DdnsSource
    types: [A]
    ttl: 300
  '':
    class: octodns_ddns.DdnsSource
    types: [A]
    ttl: 300

processors:
  pi-acme:
    class: octodns.processor.filter.NameRejectlistFilter
    # Traefik owns this transient TXT, including during DDNS reconciliation.
    rejectlist: [_acme-challenge.pi]

zones:
  # Dynamic sources follow static configuration. No static A record should
  # exist for these names. Other records remain managed by the YAML source.
  "jackharrhy.dev.":
    glob: "jackharrhy.dev."
    sources: [config, home]
    processors: [pi-acme]
    targets: [digitalocean]

  "cheesetown.rocks.":
    glob: "cheesetown.rocks."
    sources: [config, '']
    targets: [digitalocean]

  "*":
    sources: [config]
    targets: [digitalocean]
