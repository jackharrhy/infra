server {
    listen 80;
    server_name _;
    root /srv/pack;

    location = / {
        root /srv/site;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /pack.toml { add_header Cache-Control "no-cache"; }
    location = /index.toml { add_header Cache-Control "no-cache"; }
    location /mods/ { autoindex off; add_header Cache-Control "no-cache"; }
    location / { return 404; }
    location = /downloads/ { return 302 /#downloads; }
    location /downloads/ {
        alias /srv/downloads/;
        autoindex off;
        location ~ \.(zip|mrpack|jar)$ { }
        location ~ /SHA256SUMS$ { }
        location ~ / { deny all; }
    }
    location ~ /\. {
        deny all;
    }
}
