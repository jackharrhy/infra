name: cheesetown

services:
  minecraft:
    image: cheesetown-minecraft:java26
    build:
      context: .
      dockerfile_inline: |
        FROM eclipse-temurin:26-jdk AS java26
        FROM itzg/minecraft-server:java25
        COPY --from=java26 /opt/java/openjdk /opt/java26
        ENV JAVA_HOME=/opt/java26
        ENV PATH="/opt/java26/bin:$${PATH}"
    restart: unless-stopped
    stdin_open: true
    stop_grace_period: 2m
    ports:
      - "0.0.0.0:25565:25565/tcp"
      - "0.0.0.0:24454:24454/udp"
      - "0.0.0.0:8100:8100/tcp"
      - "0.0.0.0:7001:7001/tcp"
    environment:
      EULA: "true"
      TYPE: FABRIC
      VERSION: "26.3"
      FABRIC_LOADER_VERSION: "0.20.1"
      FABRIC_LAUNCHER_VERSION: "1.1.2"
      SKIP_DOWNLOAD_DEFAULTS: "true"
      SYNC_SKIP_NEWER_IN_DESTINATION: "false"
      REPLACE_ENV_DURING_SYNC: "false"
      MEMORY: 6G
      MOTD: "\u00a7echeesetown"
      RESOURCE_PACK: https://cheesetown.rocks/downloads/cheesetown-paintings-1.0.1.zip
      RESOURCE_PACK_SHA1: 23d2cf0ce1434c0ad1e06112edf1a60e24ca7bdc
      RESOURCE_PACK_ID: e0ce5cb7-45eb-5408-bd30-2ef402beec12
      RESOURCE_PACK_PROMPT: ""
      RESOURCE_PACK_ENFORCE: "false"
      DIFFICULTY: hard
      MODE: survival
      LEVEL: world
      ONLINE_MODE: "true"
      ENFORCE_SECURE_PROFILE: "true"
      ENABLE_WHITELIST: "true"
      ENFORCE_WHITELIST: "true"
      WHITELIST: cheesemany,ncashin,TheDollyLama,walgreens2,Fluffenstins,koalasthegreat,Marty4President,CatanCraft,NathanHobbs,_KFC555Noy_,AaronCS,aidan17,amye_rose,andrewgosse,Bonavistask8er,CrypticWolf1999,DarthDad,DoleBananas,ecu,gabsiscute,guitargun,Janitor_Dan,l4venza,Lakeboi_Q,Luke1124,MooMooMoo,NathanMacneil,NinjaRicecakes,nint8835,OmegaNave,RadicalDolphin,ranguli,swp147,Theoya,TheRealKingPin99,Vahnatai,Zac3138,Itz_S1las_,JeffreyEpstein03,st340,MiseDev
      OPS: cheesemany
      MAX_PLAYERS: "12"
      VIEW_DISTANCE: "16"
      SIMULATION_DISTANCE: "8"
      SPAWN_PROTECTION: "16"
      PVP: "true"
      ENABLE_RCON: "true"
      RCON_PASSWORD_FILE: /run/secrets/rcon_password
      RCON_CMDS_STARTUP: |-
        execute in minecraft:overworld run gamerule minecraft:players_sleeping_percentage 50

      TZ: America/St_Johns
      ENABLE_ROLLING_LOGS: "true"
    secrets:
      - rcon_password
    volumes:
      - /mnt/terrabud/docker-data/newport/cheesetown/fabric-data:/data
      - type: bind
        source: /mnt/terrabud/docker-data/newport/cheesetown/provisioned-mods
        target: /mods
        read_only: true
        bind:
          create_host_path: false
      - ./fabric-config:/config:ro
      - ./assets/server-icon.png:/data/server-icon.png:ro
    labels:
      traefik.enable: "false"
      com.centurylinklabs.watchtower.enable: "false"

  pack:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "0.0.0.0:8089:80/tcp"
    volumes:
      - ./client-pack:/srv/pack:ro
      - ./downloads:/srv/downloads:ro
      - ./site:/srv/site:ro
      - ./pack-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      traefik.enable: "false"
      com.centurylinklabs.watchtower.enable: "false"

  storefront:
    image: ghcr.io/jackharrhy/storefront-frontend:latest-storefront
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://minecraft:7000
    depends_on:
      minecraft:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:80"
    labels:
      traefik.enable: "false"
      com.centurylinklabs.watchtower.enable: "false"

  backup:
    image: itzg/mc-backup:latest
    restart: unless-stopped
    depends_on:
      minecraft:
        condition: service_healthy
    environment:
      RCON_HOST: minecraft
      RCON_PORT: "25575"
      RCON_PASSWORD_FILE: /run/secrets/rcon_password
      INITIAL_DELAY: "0"
      BACKUP_INTERVAL: 6h
      PRUNE_BACKUPS_DAYS: "14"
      BACKUP_NAME: cheesetown
      EXCLUDES: "*.jar,cache,logs,*.tmp,bluemap/web,bluemap/maps"
      TZ: America/St_Johns
    secrets:
      - rcon_password
    volumes:
      - /mnt/terrabud/docker-data/newport/cheesetown/fabric-data:/data:ro
      - /mnt/terrabud/docker-data/newport/cheesetown/backups:/backups
    labels:
      traefik.enable: "false"
      com.centurylinklabs.watchtower.enable: "false"

secrets:
  rcon_password:
    file: ./.runtime-secrets/rcon-password
