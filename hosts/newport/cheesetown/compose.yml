name: cheesetown

services:
  minecraft:
    image: cheesetown-minecraft:java26
    build:
      context: .
      dockerfile_inline: |
        FROM eclipse-temurin:26-jdk@sha256:5f85d786b58064f9d653973c7e3df6c36cca7b060f76c55e3f3cda3c3a50d10b AS java26
        FROM itzg/minecraft-server:java25@sha256:c1a267d9ed6de3d1157859753a002aa35f8366d8db00463df3d6b07e86d2bf1d
        COPY --from=java26 /opt/java/openjdk /opt/java26
        ENV JAVA_HOME=/opt/java26
        ENV PATH="/opt/java26/bin:$${PATH}"
    restart: unless-stopped
    stdin_open: true
    stop_grace_period: 2m
    ports:
      - "0.0.0.0:25565:25565/tcp"
      - "0.0.0.0:24454:24454/udp"
      - "0.0.0.0:8100:8100/tcp"
      - "0.0.0.0:7001:7001/tcp"
    environment:
      EULA: "true"
      TYPE: PAPER
      VERSION: "26.2"
      PAPER_BUILD: "123"
      SKIP_DOWNLOAD_DEFAULTS: "true"
      SYNC_SKIP_NEWER_IN_DESTINATION: "false"
      MEMORY: 6G
      MOTD: "\u00a7echeesetown"
      DIFFICULTY: normal
      MODE: survival
      LEVEL: world
      ONLINE_MODE: "true"
      ENFORCE_SECURE_PROFILE: "true"
      ENABLE_WHITELIST: "true"
      ENFORCE_WHITELIST: "true"
      WHITELIST: cheesemany
      OPS: cheesemany
      MAX_PLAYERS: "12"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "8"
      SPAWN_PROTECTION: "16"
      PVP: "true"
      ENABLE_RCON: "true"
      RCON_PASSWORD_FILE: /run/secrets/rcon_password
      RCON_CMDS_STARTUP: |-
        execute in minecraft:overworld run gamerule minecraft:players_sleeping_percentage 51

      MODRINTH_PROJECTS: "@/extras/plugins.txt"
      MODRINTH_DOWNLOAD_DEPENDENCIES: none
      PLUGINS: |-
        https://github.com/jackharrhy/Storefront/releases/download/2026.09.14/storefront-2.0-SNAPSHOT.jar
        https://github.com/STollenaar/ItemSorter/releases/download/v0.6.0/ItemSorter-26.2.jar
        https://github.com/Siebrenvde/AppleSkinSpigot/releases/download/2.0.2/AppleSkinSpigot-2.0.2.jar
        https://ci.ender.zone/job/EssentialsX/1827/artifact/jars/EssentialsX-2.22.1-dev%2B23-43cb76a.jar
        https://ci.ender.zone/job/EssentialsX/1827/artifact/jars/EssentialsXSpawn-2.22.1-dev%2B23-43cb76a.jar
      TZ: America/St_Johns
      ENABLE_ROLLING_LOGS: "true"
    secrets:
      - rcon_password
    volumes:
      - /mnt/terrabud/docker-data/newport/cheesetown/data:/data
      - ./config:/plugins:ro
      - ./plugins.txt:/extras/plugins.txt:ro
      - ./assets/server-icon.png:/data/server-icon.png:ro
    labels:
      traefik.enable: "false"
      com.centurylinklabs.watchtower.enable: "false"

  pack:
    image: nginx:stable-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    restart: unless-stopped
    ports:
      - "0.0.0.0:8089:80/tcp"
    volumes:
      - ./client-pack:/srv/pack:ro
      - ./downloads:/srv/downloads:ro
      - ./site:/srv/site:ro
      - ./pack-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      traefik.enable: "false"
      com.centurylinklabs.watchtower.enable: "false"

  storefront:
    image: ghcr.io/jackharrhy/storefront-frontend:latest-storefront
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://minecraft:7000
    depends_on:
      minecraft:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:80"
    labels:
      traefik.enable: "false"
      com.centurylinklabs.watchtower.enable: "false"

  backup:
    image: itzg/mc-backup@sha256:0b6a10703723e8b2c03cf19e237aaebef91deeeafceb376968a659b32c11b66f
    restart: unless-stopped
    depends_on:
      minecraft:
        condition: service_healthy
    environment:
      RCON_HOST: minecraft
      RCON_PORT: "25575"
      RCON_PASSWORD_FILE: /run/secrets/rcon_password
      INITIAL_DELAY: "0"
      BACKUP_INTERVAL: 6h
      PRUNE_BACKUPS_DAYS: "14"
      BACKUP_NAME: cheesetown
      EXCLUDES: "*.jar,cache,logs,*.tmp,bluemap/web,bluemap/maps"
      TZ: America/St_Johns
    secrets:
      - rcon_password
    volumes:
      - /mnt/terrabud/docker-data/newport/cheesetown/data:/data:ro
      - /mnt/terrabud/docker-data/newport/cheesetown/backups:/backups
    labels:
      traefik.enable: "false"
      com.centurylinklabs.watchtower.enable: "false"

secrets:
  rcon_password:
    file: ./.runtime-secrets/rcon-password
