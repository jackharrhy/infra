http:
  routers:
    8ballworld:
      rule: Host(`8ball.jackharrhy.dev`)
      entryPoints: [web]
      service: 8ballworld
    cheesetown-item-sorter:
      rule: Host(`cheesetown.rocks`) && (Path(`/item-sorter`) || PathPrefix(`/item-sorter/`))
      entryPoints: [websecure]
      middlewares: [cheesetown-app-path]
      service: cheesetown-item-sorter
      tls:
        certResolver: newporthttp
    cheesetown-map:
      rule: Host(`cheesetown.rocks`) && (Path(`/map`) || PathPrefix(`/map/`))
      entryPoints: [websecure]
      middlewares: [cheesetown-app-path]
      service: cheesetown-map
      tls:
        certResolver: newporthttp
    cheesetown-site:
      rule: Host(`cheesetown.rocks`)
      entryPoints: [websecure]
      service: cheesetown-site
      tls:
        certResolver: newporthttp
        domains:
        - main: cheesetown.rocks
    cheesetown-storefront:
      rule: Host(`cheesetown.rocks`) && (Path(`/storefront`) || PathPrefix(`/storefront/`))
      entryPoints: [websecure]
      middlewares: [cheesetown-app-path]
      service: cheesetown-storefront
      tls:
        certResolver: newporthttp
    direct-wan-guard:
      rule: '!Host(`cheesetown.rocks`) && !(ClientIP(`127.0.0.0/8`) || ClientIP(`10.0.0.0/8`) || ClientIP(`172.16.0.0/12`)
        || ClientIP(`192.168.0.0/16`) || ClientIP(`100.64.0.0/10`) || ClientIP(`::1/128`) || ClientIP(`fc00::/7`))'
      entryPoints: [web]
      priority: 1000000
      service: noop@internal
  services:
    8ballworld:
      loadBalancer:
        passHostHeader: true
        servers:
        - url: http://127.0.0.1:5189
    cheesetown-item-sorter:
      loadBalancer:
        servers:
        - url: http://127.0.0.1:7001
    cheesetown-map:
      loadBalancer:
        servers:
        - url: http://127.0.0.1:8100
    cheesetown-site:
      loadBalancer:
        servers:
        - url: http://127.0.0.1:8089
    cheesetown-storefront:
      loadBalancer:
        servers:
        - url: http://127.0.0.1:8090
  middlewares:
    cheesetown-app-path:
      chain:
        middlewares: [cheesetown-app-slash, cheesetown-app-strip-prefix]
    cheesetown-app-slash:
      redirectRegex:
        regex: ^(https?://[^/]+/(map|item-sorter|storefront))(\?.*)?$
        replacement: ${1}/${3}
        permanent: true
    cheesetown-app-strip-prefix:
      stripPrefix:
        prefixes: [/map, /item-sorter, /storefront]
