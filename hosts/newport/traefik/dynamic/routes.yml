http:
  routers:
    pi:
      rule: Host(`pi.jackharrhy.dev`)
      entryPoints: [pitailnet]
      service: pi
      middlewares: [pi-proxy-marker]
      tls:
        certResolver: newportdns
        domains:
          - main: pi.jackharrhy.dev
            sans: ['*.pi.jackharrhy.dev']
    alderpoint-preview:
      rule: Host(`alderpoint.pi.jackharrhy.dev`)
      entryPoints: [pitailnet]
      service: alderpoint-preview
      tls: {}
    alderpoint-preview-api:
      rule: Host(`alderpoint-api.pi.jackharrhy.dev`)
      entryPoints: [pitailnet]
      service: alderpoint-preview-api
      tls: {}
    4orm-preview:
      rule: Host(`4orm.pi.jackharrhy.dev`)
      entryPoints: [pitailnet]
      service: 4orm-preview
      tls: {}
    wonder-site:
      rule: Host(`wonder.pi.jackharrhy.dev`)
      entryPoints: [pitailnet]
      service: wonder-site
      tls: {}
    direct-wan-guard:
      rule: '!Host(`cheesetown.rocks`) && !Host(`jellyfin.rotund.org`) && !(ClientIP(`127.0.0.0/8`) || ClientIP(`10.0.0.0/8`) || ClientIP(`172.16.0.0/12`)
        || ClientIP(`192.168.0.0/16`) || ClientIP(`100.64.0.0/10`) || ClientIP(`::1/128`) || ClientIP(`fc00::/7`))'
      entryPoints: [web]
      priority: 1000000
      service: noop@internal
  services:
    wonder-site:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://127.0.0.1:18810
    alderpoint-preview:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://127.0.0.1:5173
    alderpoint-preview-api:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://127.0.0.1:54321
    4orm-preview:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://127.0.0.1:18954
    pi:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://127.0.0.1:8788
  middlewares:
    pi-proxy-marker:
      headers:
        customRequestHeaders:
          X-P2-Proxy-Secret: '1'
    cheesetown-app-path:
      chain:
        middlewares: [cheesetown-app-slash, cheesetown-app-strip-prefix]
    cheesetown-app-slash:
      redirectRegex:
        regex: ^(https?://[^/]+/(map|item-sorter|storefront))(\?.*)?$
        replacement: ${1}/${3}
        permanent: true
    cheesetown-app-strip-prefix:
      stripPrefix:
        prefixes: [/map, /item-sorter, /storefront]
