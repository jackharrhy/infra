http:
  routers:
    slskd:
      rule: Host(`slskd.rotund.org`)
      entryPoints: [web]
      service: slskd
      middlewares: [slskd-auth@docker]
    pi:
      rule: Host(`pi.jackharrhy.dev`)
      entryPoints: [pitailnet]
      service: pi
      middlewares: [pi-proxy-marker]
      tls:
        certResolver: newportdns
        domains:
          - main: pi.jackharrhy.dev
            sans: ['*.pi.jackharrhy.dev']
    alderpoint-preview:
      rule: Host(`alderpoint.pi.jackharrhy.dev`)
      entryPoints: [pitailnet]
      service: alderpoint-preview
      tls: {}
    alderpoint-preview-api:
      rule: Host(`alderpoint-api.pi.jackharrhy.dev`)
      entryPoints: [pitailnet]
      service: alderpoint-preview-api
      tls: {}
    4orm-preview:
      rule: Host(`4orm.pi.jackharrhy.dev`)
      entryPoints: [pitailnet]
      service: 4orm-preview
      tls: {}
    sluggers-ui:
      rule: Host(`sluggers-ui.pi.jackharrhy.dev`)
      entryPoints: [pitailnet]
      service: sluggers-ui
      tls: {}
    harrhy-ui:
      rule: Host(`harrhy-ui.pi.jackharrhy.dev`)
      entryPoints: [pitailnet]
      service: harrhy-ui
      tls: {}
    wonder-site:
      rule: Host(`wonder.pi.jackharrhy.dev`)
      entryPoints: [pitailnet]
      service: wonder-site
      tls: {}
    sluggers-old:
      rule: Host(`sluggers-old.pi.jackharrhy.dev`)
      entryPoints: [pitailnet]
      service: sluggers-old
      tls: {}
    atlas:
      rule: Host(`atlas.pi.jackharrhy.dev`)
      entryPoints: [pitailnet]
      service: atlas
      tls: {}
    atlas-preview-redirect:
      rule: Host(`atlas-preview.pi.jackharrhy.dev`)
      entryPoints: [pitailnet]
      priority: 100
      service: noop@internal
      middlewares: [atlas-canonical]
      tls: {}
    browse-mcp:
      rule: Host(`browse.pi.jackharrhy.dev`) && Path(`/mcp`)
      entryPoints: [pitailnet]
      service: browse-mcp
      tls: {}
    direct-wan-guard:
      rule: '!Host(`cheesetown.rocks`) && !Host(`jellyfin.rotund.org`) && !(ClientIP(`127.0.0.0/8`) || ClientIP(`10.0.0.0/8`) || ClientIP(`172.16.0.0/12`)
        || ClientIP(`192.168.0.0/16`) || ClientIP(`100.64.0.0/10`) || ClientIP(`::1/128`) || ClientIP(`fc00::/7`))'
      entryPoints: [web]
      priority: 1000000
      service: noop@internal
  services:
    sluggers-old:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://127.0.0.1:18951
    atlas:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://127.0.0.1:4337
    slskd:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://172.30.34.2:5030
    browse-mcp:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://127.0.0.1:19989
    sluggers-ui:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://127.0.0.1:18949
    harrhy-ui:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://127.0.0.1:18943
    wonder-site:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://127.0.0.1:18810
    alderpoint-preview:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://127.0.0.1:5173
    alderpoint-preview-api:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://127.0.0.1:54321
    4orm-preview:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://127.0.0.1:18954
    pi:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://127.0.0.1:8788
  middlewares:
    atlas-canonical:
      redirectRegex:
        regex: ^https?://atlas-preview\.pi\.jackharrhy\.dev(.*)$
        replacement: https://atlas.pi.jackharrhy.dev${1}
        permanent: true
    pi-proxy-marker:
      headers:
        customRequestHeaders:
          X-P2-Proxy-Secret: '1'
    cheesetown-app-path:
      chain:
        middlewares: [cheesetown-app-slash, cheesetown-app-strip-prefix]
    cheesetown-app-slash:
      redirectRegex:
        regex: ^(https?://[^/]+/(map|item-sorter|storefront))(\?.*)?$
        replacement: ${1}/${3}
        permanent: true
    cheesetown-app-strip-prefix:
      stripPrefix:
        prefixes: [/map, /item-sorter, /storefront]
