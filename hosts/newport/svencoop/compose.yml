name: svencoop

services:
  game:
    image: lacledeslan/gamesvr-svencoop@sha256:8d51f666c5d4de3941d6afb1fa946b0d80f660aea3c6fee8166c989a19380e46
    container_name: svencoop-train
    restart: unless-stopped
    stdin_open: true
    working_dir: /app/svencoop
    stop_signal: SIGINT
    stop_grace_period: 30s
    env_file:
      - ./.runtime-secrets/server.env
    entrypoint: ["/bin/sh", "/app/configured-entrypoint.sh"]
    command: ["/app/svends_run", "-console", "-game", "svencoop", "-port", "27015", "-num_edicts", "8192", "+maxplayers", "4", "-nodefaultmap", "+exec", "startup.cfg"]
    ports:
      - "27015:27015/udp"
    volumes:
      - type: bind
        source: /mnt/terrabud/games/svencoop/custom
        target: /app/svencoop_addon
        read_only: true
        bind:
          create_host_path: false
      - ./entrypoint.sh:/app/configured-entrypoint.sh:ro
      - ./server.cfg:/app/svencoop/server.cfg:ro
      - ./startup.cfg:/app/svencoop/startup.cfg:ro
      - ./mapcycle.txt:/app/svencoop/mapcycle.txt:ro
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  downloads:
    image: nginx@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
    container_name: svencoop-train-downloads
    restart: unless-stopped
    ports:
      - "27015:80/tcp"
    volumes:
      - type: bind
        source: /mnt/terrabud/games/svencoop/custom
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
