      - "traefik.http.middlewares.qbittorrent-auth.forwardauth.address=http://127.0.0.1:14183/"
      - "traefik.http.middlewares.qbittorrent-auth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.qbittorrent-auth.forwardauth.authRequestHeaders=Cookie,Accept"
      - "com.centurylinklabs.watchtower.enable=true"

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    networks: [web]
    environment:
      PUID: "1000"
      PGID: "65536"
      UMASK: "002"
      TZ: America/St_Johns
      WEBUI_PORT: "8087"
      TORRENTING_PORT: "6881"
    ports:
      - "127.0.0.1:8087:8087"
      - "192.168.2.30:6881:6881"
      - "192.168.2.30:6881:6881/udp"
    volumes:
      - /mnt/terrabud/docker-data/newport/qbittorrent:/config
      - ./qbittorrent/hooks:/infra:ro
      - type: bind
        source: /mnt/stash/newport/qbittorrent-backups
        target: /backups
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/stash/media/downloads/torrents
        target: /data/downloads/torrents
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8087/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    stop_grace_period: 120s
    cpus: 2
    mem_limit: 2g
    pids_limit: 256
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=newport_web"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8087"
      - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.rotund.org`)"
