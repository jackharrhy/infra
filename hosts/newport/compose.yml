services:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    network_mode: host
    command:
      - "--log.level=INFO"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      # Trust X-Forwarded-* from mug's tailnet IP only (not the full
      # tailnet CGNAT range, which would trust other peers) plus the
      # docker bridge gateway range. Per-entrypoint, so websecure stays
      # untrusted (public-facing).
      - "--entrypoints.web.forwardedheaders.trustedips=100.124.6.111/32,172.16.0.0/12"
      - "--entrypoints.websecure.address=:443"
      # Entrypoint-level http→https redirect at low priority so existing
      # `web`-only services (mug-proxied) keep working; public :80 hits
      # fall through to this redirect.
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.web.http.redirections.entrypoint.priority=10"
      # HTTP-01 rather than DNS-01 so the DO API token stays on mug.
      - "--certificatesresolvers.newporthttp.acme.email=me@jackharrhy.com"
      - "--certificatesresolvers.newporthttp.acme.httpchallenge=true"
      - "--certificatesresolvers.newporthttp.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.newporthttp.acme.storage=/letsencrypt/acme-http.json"
      # DNS-01 via Cloudflare for wildcard certs (*.workspace.cmd.softspark.dev
      # can't be issued over HTTP-01). Token lives in .runtime-secrets/traefik.env
      # (CF_DNS_API_TOKEN, scoped Zone:DNS:Edit on softspark.dev only).
      - "--certificatesresolvers.cfdns.acme.email=me@jackharrhy.com"
      - "--certificatesresolvers.cfdns.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cfdns.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--certificatesresolvers.cfdns.acme.storage=/letsencrypt/acme-dns.json"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--entrypoints.traefik.address=127.0.0.1:18081"
    env_file:
      - ./.runtime-secrets/traefik.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./volumes/traefik_letsencrypt_data:/letsencrypt

  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:1.17
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - ./.runtime-secrets/watchtower.env
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  beszel-agent:
    image: ghcr.io/henrygd/beszel/beszel-agent:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./volumes/beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - ./.runtime-secrets/beszel-agent.env

  # One container bootstraps, serves, and periodically refreshes CADO.
  cado:
    image: ghcr.io/jackharrhy/cado-search:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks: [web]
    volumes:
      - type: bind
        source: /mnt/terrabud/docker-data/newport/cado
        target: /data
        bind:
          create_host_path: false
    environment:
      - CADO_DATA_DIR=/data
      - CADO_PUBLIC_BASE_URL=https://cado.jackharrhy.dev
      - CADO_REFRESH_INTERVAL_HOURS=720
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 4g
    cpus: 4
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.services.cado.loadbalancer.server.port=8000"
      - "traefik.http.routers.cado.rule=Host(`cado.jackharrhy.dev`)"
      - "traefik.http.routers.cado.entrypoints=web"
      - "traefik.http.routers.cado.middlewares=cado-rate-limit,cado-inflight"
      - "traefik.http.middlewares.cado-rate-limit.ratelimit.average=20"
      - "traefik.http.middlewares.cado-rate-limit.ratelimit.period=1s"
      - "traefik.http.middlewares.cado-rate-limit.ratelimit.burst=40"
      - "traefik.http.middlewares.cado-inflight.inflightreq.amount=32"

  4orm:
    image: ghcr.io/jackharrhy/4orm:main
    restart: unless-stopped
    networks: [web]
    env_file:
      - ./.runtime-secrets/4orm.env
    environment:
      - FOURM_ENV=production
      - SITE_URL=https://4orm.harrhy.xyz
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - /mnt/terrabud/docker-data/newport/4orm_data:/app/data
      - /mnt/terrabud/docker-data/newport/4orm_uploads:/app/uploads
      - /mnt/terrabud/docker-data/newport/4orm_backups:/app/backups
    labels:
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.services.4orm.loadbalancer.server.port=8000"
      - "traefik.http.routers.4orm.rule=Host(`4orm.harrhy.xyz`)"
      - "traefik.http.routers.4orm.entrypoints=web"

  adam_eats:
    image: ghcr.io/jackharrhy/adam__eats:main
    restart: unless-stopped
    networks: [web]
    environment:
      - EMDASH_SITE_URL=https://adam-eats.jackharrhy.dev
    env_file:
      - ./.runtime-secrets/adam_eats.env
    volumes:
      - ./volumes/adam_eats:/app/data
    labels:
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.services.adam_eats.loadbalancer.server.port=4321"
      - "traefik.http.routers.adam_eats.rule=Host(`adam-eats.jackharrhy.dev`)"
      - "traefik.http.routers.adam_eats.entrypoints=web"

  artbin:
    image: ghcr.io/jackharrhy/artbin:main
    restart: unless-stopped
    networks: [web]
    env_file:
      - ./.runtime-secrets/artbin.env
    environment:
      - FOURM_URL=https://4orm.harrhy.xyz
      - FOURM_CLIENT_ID=artbin
      - ARTBIN_URL=https://artbin.jackharrhy.dev
    volumes:
      - /mnt/terrabud/docker-data/newport/artbin_data/data:/app/apps/web/data
      - /mnt/terrabud/docker-data/newport/artbin_data/uploads:/app/apps/web/public/uploads
      - /mnt/terrabud/docker-data/newport/artbin_data/tmp:/app/apps/web/tmp/uploads
    labels:
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.services.artbin.loadbalancer.server.port=3000"
      - "traefik.http.routers.artbin.rule=Host(`artbin.jackharrhy.dev`)"
      - "traefik.http.routers.artbin.entrypoints=web"

  worldview:
    image: ghcr.io/jackharrhy/worldview:main
    user: "1000:1000"
    restart: unless-stopped
    networks: [web, worldview_backend]
    env_file:
      - ./.runtime-secrets/worldview.env
    environment:
      - PORT=8789
      - WORLDVIEW_URL=https://worldview.harrhy.xyz
      - FOURM_URL=https://4orm.harrhy.xyz
      - FOURM_CLIENT_ID=worldview
      - ARTBIN_URL=https://artbin.jackharrhy.dev
      - FOURM_SERVICE_CLIENT_ID=worldview-service
      # FOURM_SERVICE_CLIENT_SECRET and WORLDVIEW_REALTIME_TICKET_SECRET come from worldview.env.
      - WORLDVIEW_MAP_SERVICE_URL=http://worldview-azurite:8080
      - WORLDVIEW_QUAKE_COMPILER_URL=http://worldview-compiler:8788
    volumes:
      - /mnt/terrabud/docker-data/newport/worldview_data:/data
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    ulimits:
      nofile:
        soft: 512
        hard: 512
    ports:
      - "127.0.0.1:8789:8789"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.services.worldview.loadbalancer.server.port=8789"
      - "traefik.http.routers.worldview.rule=Host(`worldview.harrhy.xyz`)"
      - "traefik.http.routers.worldview.entrypoints=web"
      - "traefik.http.routers.worldview.middlewares=worldview-rate-limit,worldview-body-limit"
      - "traefik.http.middlewares.worldview-rate-limit.ratelimit.average=20"
      - "traefik.http.middlewares.worldview-rate-limit.ratelimit.period=1s"
      - "traefik.http.middlewares.worldview-rate-limit.ratelimit.burst=40"
      - "traefik.http.middlewares.worldview-body-limit.buffering.maxRequestBodyBytes=4194304"
      - "traefik.http.middlewares.worldview-body-limit.buffering.memRequestBodyBytes=1048576"

  worldview-compiler:
    image: ghcr.io/jackharrhy/worldview:main
    restart: unless-stopped
    command: ["node", "apps/compiler-service/dist/server.js"]
    networks: [worldview_backend]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      - WORLDVIEW_COMPILER_HOST=0.0.0.0
      - WORLDVIEW_COMPILER_PORT=8788
      - WORLDVIEW_COMPILER_MAX_CONCURRENT=1
      - WORLDVIEW_COMPILER_THREADS=2
      - WORLDVIEW_COMPILER_TIMEOUT_MS=60000
      - WORLDVIEW_COMPILER_MAX_REQUEST_BYTES=41943040
      - WORLDVIEW_COMPILER_MAX_MAP_BYTES=2097152
      - WORLDVIEW_COMPILER_MAX_ASSET_BASE64_BYTES=33554432
      - WORLDVIEW_COMPILER_MAX_ARTIFACT_BYTES=67108864
      - ERICW_QBSP=/opt/ericw-tools/qbsp
      - ERICW_VIS=/opt/ericw-tools/vis
      - ERICW_LIGHT=/opt/ericw-tools/light
    volumes:
      - /home/jack/.local/lib/ericw-tools/2.0.0-alpha11:/opt/ericw-tools:ro
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    ulimits:
      nofile:
        soft: 256
        hard: 256
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # Celld's Azurite adapter intentionally connects to loopback. Sharing the
  # network namespace keeps the emulator private while exposing only the
  # Worker listener through Traefik. This is a single-host, non-critical
  # deployment; Azurite is not a qualified production fleet store.
  worldview-azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    restart: unless-stopped
    networks: [web]
    command: azurite-blob --blobHost 0.0.0.0 --location /data --disableTelemetry
    volumes:
      - /mnt/terrabud/docker-data/newport/worldview_azurite:/data
    ports:
      - "127.0.0.1:10000:10000"
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(10000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 15
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.services.worldview-celld.loadbalancer.server.port=8080"
      - "traefik.http.routers.worldview-celld.rule=Host(`worldview.harrhy.xyz`) && PathPrefix(`/sync/maps/`)"
      - "traefik.http.routers.worldview-celld.entrypoints=web"
      - "traefik.http.routers.worldview-celld.priority=100"
      - "traefik.http.routers.worldview-celld.middlewares=worldview-rooms-rate-limit,worldview-rooms-body-limit"
      - "traefik.http.middlewares.worldview-rooms-rate-limit.ratelimit.average=10"
      - "traefik.http.middlewares.worldview-rooms-rate-limit.ratelimit.period=1s"
      - "traefik.http.middlewares.worldview-rooms-rate-limit.ratelimit.burst=20"
      - "traefik.http.middlewares.worldview-rooms-body-limit.buffering.maxRequestBodyBytes=8388608"
      - "traefik.http.middlewares.worldview-rooms-body-limit.buffering.memRequestBodyBytes=1048576"

  worldview-celld-bootstrap:
    image: ghcr.io/jackharrhy/worldview-celld-deployer:main
    network_mode: service:worldview-azurite
    depends_on:
      worldview-azurite:
        condition: service_healthy
    environment:
      - AZURE_STORAGE_USE_EMULATOR=true
      - AZURE_STORAGE_ACCOUNT_NAME=devstoreaccount1
      - CELLD_BUCKET=az://worldview-celld
    pids_limit: 128
    mem_limit: 512m
    cpus: 2
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  worldview-celld:
    image: ghcr.io/denoland/celld:0.4.0
    restart: unless-stopped
    network_mode: service:worldview-azurite
    depends_on:
      worldview-celld-bootstrap:
        condition: service_completed_successfully
    environment:
      - AZURE_STORAGE_USE_EMULATOR=true
      - AZURE_STORAGE_ACCOUNT_NAME=devstoreaccount1
      - CELLD_BUCKET=az://worldview-celld
      - CELLD_WATCH=/var/lib/celld/state
      - CELLD_VARS_FILE=/run/secrets/worldview.env
      - CELLD_TRUST_FORWARDED_HEADERS=1
    command:
      - "--listen"
      - "0.0.0.0:8080"
      - "--internal-listen"
      - "127.0.0.1:8081"
    volumes:
      - /mnt/terrabud/docker-data/newport/worldview_celld:/var/lib/celld
      - ./.runtime-secrets/worldview.env:/run/secrets/worldview.env:ro
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # Monbooru keeps originals as ordinary files under /gallery and stores its
  # rebuildable SQLite index/thumbnails separately under /data. Monloader is
  # the optional network-facing downloader used by the browser extension.
  # Both UIs use the same bootstrap password from monbooru-stack.env. Rotate
  # both bcrypt hashes in the encrypted SOPS source so restarts keep the change.
  monbooru:
    image: ghcr.io/monbooru/monbooru:v1.19.1
    restart: unless-stopped
    user: "1000:1000"
    networks: [web, monbooru]
    env_file:
      - ./.runtime-secrets/monbooru-stack.env
    environment:
      - MONBOORU_SERVER_BIND_ADDRESS=0.0.0.0:8080
      - MONBOORU_SERVER_BASE_URL=https://monbooru.jackharrhy.dev
      - MONBOORU_SERVER_MONLOADER_URL=https://monloader.jackharrhy.dev
      - MONBOORU_MONLOADER_API_URL=http://monloader:8081
      - TZ=America/St_Johns
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    volumes:
      - /mnt/terrabud/docker-data/newport/monbooru/gallery:/gallery
      - /mnt/terrabud/docker-data/newport/monbooru/data:/data
      - /mnt/terrabud/docker-data/newport/monbooru/config:/config
      - /mnt/terrabud/docker-data/newport/monbooru/models:/models
    labels:
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.services.monbooru.loadbalancer.server.port=8080"
      - "traefik.http.routers.monbooru.rule=Host(`monbooru.jackharrhy.dev`)"
      - "traefik.http.routers.monbooru.entrypoints=web"

  monloader:
    image: ghcr.io/monbooru/monloader:v1.10.0
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      monbooru:
        condition: service_healthy
    networks: [web, monbooru]
    env_file:
      - ./.runtime-secrets/monbooru-stack.env
    environment:
      - MONLOADER_SERVER_BIND_ADDRESS=0.0.0.0:8081
      - MONLOADER_SERVER_BASE_URL=https://monloader.jackharrhy.dev
      - MONLOADER_MONBOORU_API_URL=http://monbooru:8080
      - MONLOADER_MONBOORU_WEB_URL=https://monbooru.jackharrhy.dev
      - TZ=America/St_Johns
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - /mnt/terrabud/docker-data/newport/monloader/config:/config
    labels:
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.services.monloader.loadbalancer.server.port=8081"
      - "traefik.http.routers.monloader.rule=Host(`monloader.jackharrhy.dev`)"
      - "traefik.http.routers.monloader.entrypoints=web"

  rotund_org:
    image: ghcr.io/jackharrhy/rotund.org:main
    restart: unless-stopped
    networks: [web]
    labels:
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.services.rotund.loadbalancer.server.port=80"
      - "traefik.http.routers.rotund.rule=Host(`rotund.org`)"
      - "traefik.http.routers.rotund.entrypoints=web"

  stickertrade:
    image: ghcr.io/fogo-sh/stickertrade:latest
    restart: unless-stopped
    networks: [web]
    env_file:
      - ./.runtime-secrets/stickertrade.env
    volumes:
      - ./volumes/stickertrade_db:/app/db
      - ./volumes/stickertrade_uploads:/app/tmp/uploads
      - ./volumes/stickertrade_sessions:/app/tmp/sessions
    labels:
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.services.stickertrade.loadbalancer.server.port=44100"
      - "traefik.http.routers.stickertrade.rule=Host(`stickertrade.ca`)"
      - "traefik.http.routers.stickertrade.entrypoints=web"

  miniflux:
    image: ghcr.io/miniflux/miniflux:latest
    restart: unless-stopped
    depends_on: [miniflux_db]
    networks: [web, miniflux]
    env_file:
      - ./.runtime-secrets/miniflux.env
    labels:
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.services.miniflux.loadbalancer.server.port=8080"
      - "traefik.http.routers.miniflux.rule=Host(`miniflux.jackharrhy.dev`)"
      - "traefik.http.routers.miniflux.entrypoints=web"

  miniflux_db:
    image: postgres:15
    restart: unless-stopped
    networks: [miniflux]
    volumes:
      - ./volumes/miniflux_db:/var/lib/postgresql/data
    env_file:
      - ./.runtime-secrets/miniflux_db.env
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  cmd:
    image: ghcr.io/s0ftspark/cmd:latest
    restart: unless-stopped
    networks: [web, cmd_db]
    env_file:
      - ./.runtime-secrets/cmd.env
    environment:
      - PHX_HOST=cmd.softspark.dev
      - MIGRATE_ON_BOOT=1
      # Workspace containers (agent-in-sandbox + SSH access containers).
      # cmd commands the host daemon via the mounted socket; workspace
      # containers join newport_web so they can reach cmd's MCP endpoint
      # by service name.
      - WORKSPACE_IMAGE=ghcr.io/s0ftspark/cmd:workspace
      - WORKSPACE_DOCKER_NETWORK=newport_web
      - MCP_URL=http://cmd:4000/api/mcp
      - WORKSPACE_HOST_ROOT=/mnt/terrabud/docker-data/newport/cmd_data/workspaces
      - OPENCODE_DATA_HOST_DIR=/mnt/terrabud/docker-data/newport/cmd_data/opencode
      # SSH workspace gateway (BEAM-terminated; host key persists in /data).
      - SSH_GATEWAY_PORT=2222
      - SSH_HOST_KEY_DIR=/data/ssh_host_keys
      # Public DNS + router forward live as of 2026-06-12; pages
      # advertise ssh <workspace>@workspace.cmd.softspark.dev.
      - SSH_ADVERTISED_HOST=workspace.cmd.softspark.dev
    ports:
      - "2222:2222"
    volumes:
      - /mnt/terrabud/docker-data/newport/cmd_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.services.cmd.loadbalancer.server.port=4000"
      - "traefik.http.routers.cmd.rule=Host(`cmd.softspark.dev`)"
      - "traefik.http.routers.cmd.entrypoints=web"

  # cmd's Postgres + pgvector. Internal-only (cmd_db network, no published
  # ports); cmd reaches it at cmd_postgres:5432 (its DATABASE_URL). Data on
  # the big terrabud disk.
  cmd_postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    networks: [cmd_db]
    env_file:
      - ./.runtime-secrets/cmd_postgres.env
    volumes:
      - /mnt/terrabud/docker-data/newport/cmd_postgres:/var/lib/postgresql/data

  # Object storage (S3-compatible) for cmd: finance source documents + the
  # docs typst import surface (Cmd.ObjectStore.S3 → http://garage:3900).
  # Internal-only (cmd_db, no published ports). rpc_secret + admin_token come
  # from the env (cmd_garage.enc.yaml), not garage.toml. The bucket + access
  # key were bootstrapped via `docker exec ... /garage {layout,bucket,key}`
  # (the distroless image has no /bin/sh); OBJECT_STORE_* live in cmd.enc.yaml.
  cmd_garage:
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    networks:
      cmd_db:
        aliases: [garage]
    env_file:
      - ./.runtime-secrets/cmd_garage.env
    volumes:
      - /mnt/terrabud/docker-data/newport/cmd_garage/meta:/var/lib/garage/meta
      - /mnt/terrabud/docker-data/newport/cmd_garage/data:/var/lib/garage/data
      - ./cmd_garage/garage.toml:/etc/garage.toml:ro

  bar:
    image: ghcr.io/jackharrhy/bar:main
    restart: unless-stopped
    networks: [web]
    labels:
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.middlewares.bar-strip-prefix.stripprefix.prefixes=/bar"
      - "traefik.http.services.bar.loadbalancer.server.port=8080"
      - "traefik.http.routers.bar.rule=(Host(`jackharrhy.dev`) && PathPrefix(`/bar`))"
      - "traefik.http.routers.bar.middlewares=bar-strip-prefix@docker"
      - "traefik.http.routers.bar.entrypoints=web"

  duaas:
    image: ghcr.io/jackharrhy/duaas:main
    restart: unless-stopped
    networks: [web]
    labels:
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.middlewares.duaas-strip-prefix.stripprefix.prefixes=/urandom"
      - "traefik.http.services.duaas.loadbalancer.server.port=8000"
      - "traefik.http.routers.duaas.rule=(Host(`jackharrhy.dev`) && PathPrefix(`/urandom`))"
      - "traefik.http.routers.duaas.middlewares=duaas-strip-prefix@docker"
      - "traefik.http.routers.duaas.entrypoints=web"

  phapbot:
    image: ghcr.io/jackharrhy/phapbot:latest
    restart: unless-stopped
    env_file:
      - ./.runtime-secrets/phapbot.env

  incydecy:
    image: ghcr.io/jackharrhy/incydecy:main
    restart: unless-stopped
    env_file:
      - ./.runtime-secrets/incydecy.env
    volumes:
      - ./volumes/incydecy:/app/data

  house:
    image: ghcr.io/jackharrhy/get-house-pls:main
    restart: unless-stopped
    # Chrome needs more than Docker's default 64MB /dev/shm
    shm_size: "2gb"
    env_file:
      - ./.runtime-secrets/house.env
    volumes:
      - ./volumes/house_data:/data

  steve:
    image: ghcr.io/jackharrhy/letters-to-steve:latest
    restart: unless-stopped
    networks: [web]
    volumes:
      - ./volumes/steve:/code/data
    labels:
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.services.steve.loadbalancer.server.port=5000"
      - "traefik.http.routers.steve.rule=Host(`steve-letter-writ.ing`)"
      - "traefik.http.routers.steve.entrypoints=web"

  notscared_site:
    image: ghcr.io/jackharrhy/notscared-site:main
    restart: unless-stopped
    networks: [web]
    labels:
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.services.notscared_site.loadbalancer.server.port=4321"
      - "traefik.http.routers.notscared_site.rule=Host(`notsca.red`)"
      - "traefik.http.routers.notscared_site.entrypoints=web"

  # Penpot — open-source design platform (Figma alternative). Only the
  # frontend is web-exposed; backend/exporter/mcp/postgres/valkey stay on
  # the internal penpot network. Registration is disabled (single-user
  # instance); create your account via the backend CLI:
  #   docker exec -ti penpot-penpot-backend-1 python3 manage.py create-profile
  # Email verification is disabled (no SMTP relay). Secure session cookies
  # are kept enabled (served over HTTPS via mug's traefik → newport tailnet
  # forward). Version pinned per Penpot docs.
  penpot_frontend:
    image: penpotapp/frontend:2.16
    restart: unless-stopped
    networks: [web, penpot]
    environment:
      - PENPOT_FLAGS=enable-prepl-server enable-mcp disable-email-verification disable-registration
      - PENPOT_PUBLIC_URI=https://penpot.jackharrhy.dev
      - PENPOT_HTTP_SERVER_MAX_BODY_SIZE=367001600
    volumes:
      - ./volumes/penpot_assets:/opt/data/assets
    depends_on: [penpot_backend, penpot_exporter, penpot_mcp]
    labels:
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.services.penpot.loadbalancer.server.port=8080"
      - "traefik.http.routers.penpot.rule=Host(`penpot.jackharrhy.dev`)"
      - "traefik.http.routers.penpot.entrypoints=web"

  penpot_backend:
    image: penpotapp/backend:2.16
    restart: unless-stopped
    networks:
      penpot:
        # Frontend's bundled nginx.conf hardcodes hyphenated upstream names.
        aliases: [penpot-backend]
    env_file:
      - ./.runtime-secrets/penpot_db.env
      - ./.runtime-secrets/penpot.env
    environment:
      - PENPOT_FLAGS=enable-prepl-server enable-mcp disable-email-verification disable-registration
      - PENPOT_PUBLIC_URI=https://penpot.jackharrhy.dev
      - PENPOT_HTTP_SERVER_MAX_BODY_SIZE=367001600
      - PENPOT_DATABASE_URI=postgresql://penpot_postgres/penpot
      - PENPOT_REDIS_URI=redis://penpot_valkey/0
      - PENPOT_OBJECTS_STORAGE_BACKEND=fs
      - PENPOT_OBJECTS_STORAGE_FS_DIRECTORY=/opt/data/assets
    volumes:
      - ./volumes/penpot_assets:/opt/data/assets
    depends_on:
      penpot_postgres:
        condition: service_healthy
      penpot_valkey:
        condition: service_healthy

  penpot_mcp:
    image: penpotapp/mcp:2.16
    restart: unless-stopped
    networks:
      penpot:
        aliases: [penpot-mcp]

  penpot_exporter:
    image: penpotapp/exporter:2.16
    restart: unless-stopped
    networks:
      penpot:
        aliases: [penpot-exporter]
    env_file:
      - ./.runtime-secrets/penpot.env
    environment:
      - PENPOT_PUBLIC_URI=http://penpot_frontend:8080
      - PENPOT_REDIS_URI=redis://penpot_valkey/0
    depends_on:
      penpot_valkey:
        condition: service_healthy

  penpot_postgres:
    image: postgres:15
    restart: unless-stopped
    stop_signal: SIGINT
    networks: [penpot]
    env_file:
      - ./.runtime-secrets/penpot_db.env
    environment:
      - POSTGRES_INITDB_ARGS=--data-checksums
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penpot"]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 2s
    volumes:
      - ./volumes/penpot_postgres:/var/lib/postgresql/data

  penpot_valkey:
    image: valkey/valkey:8.1
    restart: unless-stopped
    networks: [penpot]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
      start_period: 3s
    environment:
      - VALKEY_EXTRA_FLAGS=--maxmemory 128mb --maxmemory-policy volatile-lfu

networks:
  web:
  worldview_backend:
    internal: true
  monbooru:
  penpot:
  miniflux:
  sluggers_super_draft:
  cmd_db:
    external: true
    name: newport_cmd_db
