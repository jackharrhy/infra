  navidrome:
    image: navidrome/navidrome:latest
    restart: unless-stopped
    init: true
    user: "1000:1000"
    group_add: ["65536"]
    networks: [navidrome_backend]
    ports: ["127.0.0.1:4533:4533"]
    environment:
      TZ: America/St_Johns
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_CACHEFOLDER: /data/cache
      ND_BASEURL: https://music.rotund.org
      ND_ENFORCENONROOTUSER: "true"
      ND_EXTAUTH_TRUSTEDSOURCES: 172.30.33.1/32
      ND_EXTAUTH_USERHEADER: X-Navidrome-User
      ND_EXTAUTH_LOGOUTURL: https://music.rotund.org/oauth2/sign_out?rd=https%3A%2F%2Fauth.jackharrhy.dev%2F
      ND_ENABLEINSIGHTSCOLLECTOR: "false"
      ND_ENABLESHARING: "false"
      ND_SCANNER_SCHEDULE: "@every 1h"
      ND_SCANNER_WATCHERWAIT: "0"
      ND_SCANNER_FOLLOWSYMLINKS: "false"
      ND_SCANNER_PURGEMISSING: never
      ND_TRANSCODING_MAXCONCURRENT: "2"
      ND_TRANSCODINGCACHESIZE: 1GB
      ND_BACKUP_PATH: /backups
      ND_BACKUP_SCHEDULE: "@every 24h"
      ND_BACKUP_COUNT: "14"
    volumes:
      - /mnt/terrabud/docker-data/newport/navidrome:/data
      - type: bind
        source: /mnt/stash/media/library/music
        target: /music
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/stash/newport/navidrome-backups
        target: /backups
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:4533/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    stop_grace_period: 30s
    cpus: 2
    mem_limit: 1g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=newport_navidrome_backend"
      - "traefik.http.services.navidrome.loadbalancer.server.port=4533"
      - "traefik.http.routers.navidrome.rule=Host(`music.rotund.org`)"
      - "traefik.http.routers.navidrome.entrypoints=web"
      - "traefik.http.routers.navidrome.middlewares=navidrome-strip-user,navidrome-auth,navidrome-user"
      - "traefik.http.routers.navidrome-subsonic.rule=Host(`music.rotund.org`) && PathPrefix(`/rest/`)"
      - "traefik.http.routers.navidrome-subsonic.entrypoints=web"
      - "traefik.http.routers.navidrome-subsonic.service=navidrome"
      - "traefik.http.routers.navidrome-subsonic.middlewares=navidrome-strip-user"
      - "traefik.http.middlewares.navidrome-strip-user.headers.customrequestheaders.X-Navidrome-User="
      - "traefik.http.middlewares.navidrome-strip-user.headers.customrequestheaders.Remote-User="
      - "traefik.http.middlewares.navidrome-strip-user.headers.customrequestheaders.X-Forwarded-User="
      - "traefik.http.middlewares.navidrome-strip-user.headers.customrequestheaders.X-Auth-Request-User="
      # The fixed existing-account mapping is reached only after the Jack-subject allowlist passes.
      - "traefik.http.middlewares.navidrome-user.headers.customrequestheaders.X-Navidrome-User=jack"
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.lifecycle.pre-update=/bin/sh -c '/app/navidrome backup create --backup-dir /backups || exit 75'"
      - "com.centurylinklabs.watchtower.lifecycle.pre-update-timeout=3"

