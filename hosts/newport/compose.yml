x-media-auth: &media-auth
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.2
  restart: unless-stopped
  networks: [web]
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 128m
  pids_limit: 64
  environment: &media-auth-environment
    OAUTH2_PROXY_PROVIDER: oidc
    OAUTH2_PROXY_OIDC_ISSUER_URL: https://auth.jackharrhy.dev
    OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
    OAUTH2_PROXY_UPSTREAMS: static://202
    OAUTH2_PROXY_REVERSE_PROXY: "true"
    OAUTH2_PROXY_SCOPE: openid email profile
    # The signed immutable subject is the allowlist, not an email or global role.
    OAUTH2_PROXY_OIDC_GROUPS_CLAIM: sub
    OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
    OAUTH2_PROXY_INSECURE_OIDC_SKIP_NONCE: "false"
    OAUTH2_PROXY_COOKIE_NAME: __Host-media_admin
    OAUTH2_PROXY_COOKIE_SECURE: "true"
    OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
    OAUTH2_PROXY_COOKIE_SAMESITE: lax
    OAUTH2_PROXY_COOKIE_EXPIRE: 1h
    OAUTH2_PROXY_COOKIE_REFRESH: 0s
    OAUTH2_PROXY_EMAIL_DOMAINS: "*"
    OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    OAUTH2_PROXY_PASS_ACCESS_TOKEN: "false"
    OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "false"
    OAUTH2_PROXY_PASS_USER_HEADERS: "false"
    OAUTH2_PROXY_REQUEST_LOGGING: "false"
    OAUTH2_PROXY_AUTH_LOGGING: "false"
    OAUTH2_PROXY_SILENCE_PING_LOGGING: "true"

services:
  cleanuparr-auth:
    <<: *media-auth
    env_file: [.runtime-secrets/cleanuparr-auth.env]
    ports: ["127.0.0.1:14187:4180"]
    environment:
      <<: *media-auth-environment
      OAUTH2_PROXY_REDIRECT_URL: https://cleanuparr.rotund.org/oauth2/callback
      OAUTH2_PROXY_WHITELIST_DOMAINS: cleanuparr.rotund.org,auth.jackharrhy.dev
      OAUTH2_PROXY_COOKIE_NAME: __Host-cleanuparr_auth
      OAUTH2_PROXY_COOKIE_REFRESH: "0"
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: Jack Auth
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=newport_web"
      - "traefik.http.routers.cleanuparr-oauth.rule=Host(`cleanuparr.rotund.org`) && PathPrefix(`/oauth2/`)"
      - "traefik.http.routers.cleanuparr-oauth.entrypoints=web"
      - "traefik.http.routers.cleanuparr-oauth.service=cleanuparr-auth"
      - "traefik.http.services.cleanuparr-auth.loadbalancer.server.port=4180"
      - "traefik.http.middlewares.cleanuparr-auth.forwardauth.address=http://127.0.0.1:14187/"
      - "traefik.http.middlewares.cleanuparr-auth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.cleanuparr-auth.forwardauth.authRequestHeaders=Cookie,Accept"
      - "com.centurylinklabs.watchtower.enable=true"

  adguardhome:
    image: adguard/adguardhome:latest
    restart: unless-stopped
    init: true
    networks: [dns]
    ports:
      - "192.168.2.30:53:5353/udp"
      - "192.168.2.30:53:5353/tcp"
      - "127.0.0.1:11300:3000"
    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    command: ["--no-check-update", "--web-addr", "0.0.0.0:3000", "-c", "/opt/adguardhome/conf/AdGuardHome.yaml", "-w", "/opt/adguardhome/work"]
    volumes:
      - /mnt/terrabud/docker-data/newport/adguardhome/conf:/opt/adguardhome/conf
      - /mnt/terrabud/docker-data/newport/adguardhome/work:/opt/adguardhome/work
      - ./adguardhome/backup.sh:/infra/backup.sh:ro
      - type: bind
        source: /mnt/terrabud/docker-data/newport/adguardhome/backups
        target: /backups
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    labels:
      - "traefik.enable=false"
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.lifecycle.pre-check=/bin/sh -c '/bin/sh /infra/backup.sh daily || exit 75'"
      - "com.centurylinklabs.watchtower.lifecycle.pre-update=/bin/sh -c '/bin/sh /infra/backup.sh || exit 75'"
      - "com.centurylinklabs.watchtower.lifecycle.pre-check-timeout=3"
      - "com.centurylinklabs.watchtower.lifecycle.pre-update-timeout=3"

  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    restart: unless-stopped
    init: true
    user: "1000:1000"
    group_add: ["65536"]
    networks: [web]
    ports: ["127.0.0.1:11011:11011"]
    environment:
      TZ: America/St_Johns
      PORT: "11011"
      UMASK: "077"
    volumes:
      - /mnt/terrabud/docker-data/newport/cleanuparr:/config
      - ./cleanuparr/backup.py:/infra/backup.py:ro
      - type: bind
        source: /mnt/stash/newport/cleanuparr-backups
        target: /backups
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:11011/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    cpus: 1
    mem_limit: 512m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=newport_web"
      - "traefik.http.services.cleanuparr.loadbalancer.server.port=11011"
      - "traefik.http.routers.cleanuparr.rule=Host(`cleanuparr.rotund.org`)"
      - "traefik.http.routers.cleanuparr.entrypoints=web"
      - "traefik.http.routers.cleanuparr.service=cleanuparr"
      - "traefik.http.routers.cleanuparr.middlewares=cleanuparr-auth"
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.lifecycle.pre-check=/bin/sh -c 'python3 /infra/backup.py daily || exit 75'"
      - "com.centurylinklabs.watchtower.lifecycle.pre-update=/bin/sh -c 'python3 /infra/backup.py || exit 75'"
      - "com.centurylinklabs.watchtower.lifecycle.pre-check-timeout=3"
      - "com.centurylinklabs.watchtower.lifecycle.pre-update-timeout=3"

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    restart: unless-stopped
    init: true
    user: "1000:1000"
    group_add: ["65536"]
    networks: [web]
    ports: ["127.0.0.1:5055:5055"]
    environment:
      TZ: America/St_Johns
      LOG_LEVEL: info
      PORT: "5055"
    volumes:
      - /mnt/terrabud/docker-data/newport/seerr:/app/config
      - ./seerr/backup.mjs:/infra/backup.mjs:ro
      - type: bind
        source: /mnt/stash/newport/seerr-backups
        target: /backups
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5055/api/v1/settings/public"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    cpus: 2
    mem_limit: 1g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=newport_web"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"
      - "traefik.http.routers.seerr.rule=Host(`seerr.rotund.org`)"
      - "traefik.http.routers.seerr.entrypoints=web"
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.lifecycle.pre-check=/bin/sh -c 'node /infra/backup.mjs daily || exit 75'"
      - "com.centurylinklabs.watchtower.lifecycle.pre-update=/bin/sh -c 'node /infra/backup.mjs || exit 75'"
      - "com.centurylinklabs.watchtower.lifecycle.pre-check-timeout=3"
      - "com.centurylinklabs.watchtower.lifecycle.pre-update-timeout=3"

  navidrome-auth:
