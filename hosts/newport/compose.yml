services:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    network_mode: host
    command:
      - "--log.level=INFO"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      # Trust X-Forwarded-* from mug's tailnet IP only (not the full
      # tailnet CGNAT range, which would trust other peers) plus the
      # docker bridge gateway range. Per-entrypoint, so websecure stays
      # untrusted (public-facing).
      - "--entrypoints.web.forwardedheaders.trustedips=100.124.6.111/32,172.16.0.0/12"
      - "--entrypoints.websecure.address=:443"
      # Entrypoint-level http→https redirect at low priority so existing
      # `web`-only services (mug-proxied) keep working; public :80 hits
      # fall through to this redirect.
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.web.http.redirections.entrypoint.priority=10"
      # HTTP-01 rather than DNS-01 so the DO API token stays on mug.
      - "--certificatesresolvers.newporthttp.acme.email=me@jackharrhy.com"
      - "--certificatesresolvers.newporthttp.acme.httpchallenge=true"
      - "--certificatesresolvers.newporthttp.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.newporthttp.acme.storage=/letsencrypt/acme-http.json"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--entrypoints.traefik.address=127.0.0.1:18081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./volumes/traefik_letsencrypt_data:/letsencrypt

  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:1.17
    restart: unless-stopped
    environment:
      WATCHTOWER_CLEANUP: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - ./.runtime-secrets/watchtower.env
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  beszel-agent:
    image: ghcr.io/henrygd/beszel/beszel-agent:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./volumes/beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - ./.runtime-secrets/beszel-agent.env

  cado:
    image: ghcr.io/jackharrhy/cado-search:latest
    restart: unless-stopped
    user: root
    networks: [web]
    volumes:
      - /mnt/terrabud/docker-data/newport/cado:/data
    environment:
      - CADO_PUBLIC_BASE_URL=https://cado.jackharrhy.dev
    labels:
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.services.cado.loadbalancer.server.port=8000"
      - "traefik.http.routers.cado.rule=Host(`cado.jackharrhy.dev`)"
      - "traefik.http.routers.cado.entrypoints=web"

  4orm:
    image: ghcr.io/jackharrhy/4orm:main
    restart: unless-stopped
    networks: [web]
    env_file:
      - ./.runtime-secrets/4orm.env
    environment:
      - FOURM_ENV=production
      - SITE_URL=https://4orm.harrhy.xyz
      - CENTRAL_AUTH_ENABLED=1
      - OIDC_ISSUER=https://auth.jackharrhy.dev
      - OIDC_CLIENT_ID=396747761673830403
      - OIDC_REDIRECT_URI=https://4orm.harrhy.xyz/auth/callback
      - CENTRAL_AUTH_ENROLLMENT_KEY_FILE=/run/secrets/enrollment.json
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - /mnt/terrabud/docker-data/newport/4orm_data:/app/data
      - /mnt/terrabud/docker-data/newport/4orm_uploads:/app/uploads
      - /mnt/terrabud/docker-data/newport/4orm_backups:/app/backups
      - ./jack-auth/.runtime-secrets/fourm-enrollment-key.json:/run/secrets/enrollment.json:ro
    labels:
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.services.4orm.loadbalancer.server.port=8000"
      - "traefik.http.routers.4orm.rule=Host(`4orm.harrhy.xyz`)"
      - "traefik.http.routers.4orm.entrypoints=web"
      - "com.centurylinklabs.watchtower.enable=true"

  adam_eats:
    image: ghcr.io/jackharrhy/adam__eats:main
    restart: unless-stopped
    networks: [web]
    environment:
      - EMDASH_SITE_URL=https://adam-eats.jackharrhy.dev
    env_file:
      - ./.runtime-secrets/adam_eats.env
    volumes:
      - ./volumes/adam_eats:/app/data
    labels:
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.services.adam_eats.loadbalancer.server.port=4321"
      - "traefik.http.routers.adam_eats.rule=Host(`adam-eats.jackharrhy.dev`)"
      - "traefik.http.routers.adam_eats.entrypoints=web"

  artbin:
    image: ghcr.io/jackharrhy/tea-artbin:latest
    restart: unless-stopped
    networks: [web]
    env_file:
      - ./.runtime-secrets/artbin.env
    environment:
      - FOURM_URL=https://4orm.harrhy.xyz
      - FOURM_CLIENT_ID=artbin
      - ARTBIN_URL=https://artbin.jackharrhy.dev
    volumes:
      - /mnt/terrabud/docker-data/newport/artbin_tea_data/data:/app/apps/artbin/data
      - /mnt/terrabud/docker-data/newport/artbin_tea_data/uploads:/app/apps/artbin/public/uploads
      - /mnt/terrabud/docker-data/newport/artbin_tea_data/tmp:/app/apps/artbin/tmp/uploads
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.services.artbin.loadbalancer.server.port=3000"
      - "traefik.http.routers.artbin.rule=Host(`artbin.jackharrhy.dev`)"
      - "traefik.http.routers.artbin.entrypoints=web"

  maps-ui:
    image: ghcr.io/jackharrhy/tea-maps:latest
    restart: unless-stopped
    networks: [web, maps_backend]
    environment:
      - CELLD_VAR_MAPS_SERVICE_ORIGIN=http://maps-service:8792
      - CELLD_VAR_MAPS_COLLABORATION_ORIGIN=http://maps-collaboration:44100
      - CELLD_TRUST_FORWARDED_HEADERS=1
    volumes:
      - /mnt/terrabud/docker-data/newport/maps_ui_celld:/app/.celld
    ports:
      - "127.0.0.1:8790:8790"
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    stop_grace_period: 90s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.services.maps-ui.loadbalancer.server.port=8790"
      - "traefik.http.routers.maps-ui.rule=Host(`maps.jackharrhy.dev`)"
      - "traefik.http.routers.maps-ui.entrypoints=web"
      - "traefik.http.routers.maps-ui.middlewares=maps-public-origin"
      - "traefik.http.middlewares.maps-public-origin.headers.customrequestheaders.X-Forwarded-Host=maps.jackharrhy.dev"
      - "traefik.http.middlewares.maps-public-origin.headers.customrequestheaders.X-Forwarded-Proto=https"

  maps-service:
    image: ghcr.io/jackharrhy/tea-maps-service:latest
    restart: unless-stopped
    networks: [web, maps_backend]
    env_file:
      - ./.runtime-secrets/maps-ticket.env
      - ./.runtime-secrets/maps-service.env
    environment:
      - TEA_MAPS_URL=https://maps.jackharrhy.dev
      - TEA_MAPS_COLLABORATION_URL=http://maps-collaboration:44100
      - FOURM_URL=https://4orm.harrhy.xyz
      - FOURM_CLIENT_ID=tea-maps
      - TEA_MAPS_FOURM_INTROSPECTION_CLIENT_ID=tea-maps-server
      - TEA_MAPS_MCP_SCOPE=maps:admin
      - TEA_MAPS_ARTBIN_URL=https://artbin.jackharrhy.dev
      - TEA_MAPS_ARTBIN_CLIENT_ID=tea-maps-service
      - TEA_MAPS_QUAKE_COMPILER_URL=http://maps-compiler:8788
      - TEA_MAPS_GOWER_COMPILER_URL=http://maps-gower-compiler:8788
    volumes:
      - /mnt/terrabud/docker-data/newport/maps_service_tea:/app/data
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  maps-collaboration:
    image: ghcr.io/jackharrhy/tea-maps-collaboration:latest
    restart: unless-stopped
    networks: [maps_backend]
    environment:
      - CELLD_VARS_FILE=/run/secrets/maps-ticket.env
    volumes:
      - /mnt/terrabud/docker-data/newport/maps_collaboration_tea_v2:/app/.celld
      - ./.runtime-secrets/maps-ticket.env:/run/secrets/maps-ticket.env:ro
    pids_limit: 128
    mem_limit: 1g
    cpus: 1
    stop_grace_period: 90s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  maps-compiler:
    image: ghcr.io/jackharrhy/tea-maps-compiler:latest
    restart: unless-stopped
    networks: [maps_backend]
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    environment:
      - TEA_MAPS_COMPILER_ORIGINS=https://maps.jackharrhy.dev
      - TEA_MAPS_COMPILER_MAX_CONCURRENT=1
      - TEA_MAPS_COMPILER_THREADS=2
      - TEA_MAPS_COMPILER_TIMEOUT_MS=60000
      - TEA_MAPS_COMPILER_MAX_REQUEST_BYTES=188743680
      - TEA_MAPS_COMPILER_MAX_MAP_BYTES=2097152
      - TEA_MAPS_COMPILER_MAX_ASSET_BASE64_BYTES=180355072
      - TEA_MAPS_COMPILER_MAX_ARTIFACT_BYTES=67108864
      - ERICW_QBSP=/opt/ericw-tools/qbsp
      - ERICW_VIS=/opt/ericw-tools/vis
      - ERICW_LIGHT=/opt/ericw-tools/light
    volumes:
      - /home/jack/.local/lib/ericw-tools/2.0.0-alpha11:/opt/ericw-tools:ro
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  maps-gower-compiler:
    image: ghcr.io/jackharrhy/tea-maps-compiler:latest
    restart: unless-stopped
    networks: [maps_backend]
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    environment:
      - TEA_MAPS_GAME_PROFILE=gower
      - TEA_MAPS_COMPILER_ORIGINS=https://maps.jackharrhy.dev
      - TEA_MAPS_COMPILER_MAX_CONCURRENT=1
      - TEA_MAPS_COMPILER_THREADS=6
      - TEA_MAPS_COMPILER_TIMEOUT_MS=1800000
      - TEA_MAPS_COMPILER_MAX_REQUEST_BYTES=188743680
      - TEA_MAPS_COMPILER_MAX_MAP_BYTES=2097152
      - TEA_MAPS_COMPILER_MAX_ASSETS=64
      - TEA_MAPS_COMPILER_MAX_ASSET_BASE64_BYTES=180355072
      - TEA_MAPS_COMPILER_MAX_ARTIFACT_BYTES=67108864
      - ERICW_QBSP=/opt/ericw-tools/qbsp
      - ERICW_VIS=/opt/ericw-tools/vis
      - ERICW_LIGHT=/opt/ericw-tools/light
    volumes:
      - /home/jack/.local/lib/ericw-tools/2.0.0-alpha11:/opt/ericw-tools:ro
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 4g
    cpus: 6
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  ref-celld:
    image: ghcr.io/jackharrhy/tea-ref:latest
    restart: unless-stopped
    networks: [web]
    ports:
      - "127.0.0.1:8794:8080"
    environment:
      - CELLD_VARS_FILE=/run/secrets/ref.env
      - CELLD_TRUST_FORWARDED_HEADERS=1
    volumes:
      - /mnt/terrabud/docker-data/newport/ref_celld_tea:/app/.celld
      - ./.runtime-secrets/ref.env:/run/secrets/ref.env:ro
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    stop_grace_period: 90s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.services.ref-celld.loadbalancer.server.port=8080"
      - "traefik.http.routers.ref-celld.rule=Host(`ref.jackharrhy.dev`)"
      - "traefik.http.routers.ref-celld.entrypoints=web"
      # Mug terminates TLS; Celld needs the browser origin for WebSocket checks.
      - "traefik.http.routers.ref-celld.middlewares=ref-public-origin"
      - "traefik.http.middlewares.ref-public-origin.headers.customrequestheaders.X-Forwarded-Host=ref.jackharrhy.dev"
      - "traefik.http.middlewares.ref-public-origin.headers.customrequestheaders.X-Forwarded-Proto=https"

  marky:
    image: ghcr.io/jackharrhy/tea-marky:latest
    restart: unless-stopped
    networks: [web]
    env_file:
      - ./.runtime-secrets/marky.env
    environment:
      - MARKY_AUTH=discord
      - MARKY_BASE_URL=https://md.jackharrhy.dev
      - MARKY_CONTENT_DIR=/app/data/content
      - MARKY_SESSION_DIR=/app/data/sessions
    volumes:
      - /mnt/terrabud/docker-data/newport/marky_tea:/app/data
    pids_limit: 128
    mem_limit: 512m
    labels:
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.services.marky.loadbalancer.server.port=44100"
      - "traefik.http.routers.marky.rule=Host(`md.jackharrhy.dev`)"
      - "traefik.http.routers.marky.entrypoints=web"
      - "com.centurylinklabs.watchtower.enable=true"

  rotund_org:
    image: ghcr.io/jackharrhy/rotund.org:main
    restart: unless-stopped
    networks: [web]
    labels:
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.services.rotund.loadbalancer.server.port=80"
      - "traefik.http.routers.rotund.rule=Host(`rotund.org`)"
      - "traefik.http.routers.rotund.entrypoints=web"

  stickertrade:
    image: ghcr.io/fogo-sh/stickertrade:latest
    restart: unless-stopped
    networks: [web]
    env_file:
      - ./.runtime-secrets/stickertrade.env
    volumes:
      - ./volumes/stickertrade_db:/app/db
      - ./volumes/stickertrade_uploads:/app/tmp/uploads
      - ./volumes/stickertrade_sessions:/app/tmp/sessions
    labels:
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.services.stickertrade.loadbalancer.server.port=44100"
      - "traefik.http.routers.stickertrade.rule=Host(`stickertrade.ca`)"
      - "traefik.http.routers.stickertrade.entrypoints=web"

  miniflux:
    image: ghcr.io/miniflux/miniflux:latest
    restart: unless-stopped
    depends_on: [miniflux_db]
    networks: [web, miniflux]
    env_file:
      - ./.runtime-secrets/miniflux.env
    labels:
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.services.miniflux.loadbalancer.server.port=8080"
      - "traefik.http.routers.miniflux.rule=Host(`miniflux.jackharrhy.dev`)"
      - "traefik.http.routers.miniflux.entrypoints=web"

  miniflux_db:
    image: postgres:15
    restart: unless-stopped
    networks: [miniflux]
    volumes:
      - ./volumes/miniflux_db:/var/lib/postgresql/data
    env_file:
      - ./.runtime-secrets/miniflux_db.env
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  cmd:
    image: ghcr.io/s0ftspark/cmd:latest
    restart: unless-stopped
    networks: [web, cmd_db]
    env_file:
      - ./.runtime-secrets/cmd.env
    environment:
      - PHX_HOST=cmd.softspark.dev
      - MIGRATE_ON_BOOT=1
      # Traefik reaches this service through the newport_web bridge gateway.
      - OAUTH_TRUSTED_PROXIES=172.21.0.1/32
      - GITHUB_APP_PRIVATE_KEY_PATH=/run/secrets/cmd_github_app.pem
      - OAUTH_SIGNING_PRIVATE_KEY_PATH=/run/secrets/cmd_oauth_signing.pem
    volumes:
      # Generated document PDFs are cached here.
      - /mnt/terrabud/docker-data/newport/cmd_data:/data
      - ./.runtime-secrets/cmd_github_app.pem:/run/secrets/cmd_github_app.pem:ro
      - ./.runtime-secrets/cmd_oauth_signing.pem:/run/secrets/cmd_oauth_signing.pem:ro
    labels:
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.services.cmd.loadbalancer.server.port=4000"
      - "traefik.http.routers.cmd.rule=Host(`cmd.softspark.dev`)"
      - "traefik.http.routers.cmd.entrypoints=web"

  # cmd's Postgres + pgvector. Internal-only (cmd_db network, no published
  # ports); cmd reaches it at cmd_postgres:5432 (its DATABASE_URL). Data on
  # the big terrabud disk.
  cmd_postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    networks: [cmd_db]
    env_file:
      - ./.runtime-secrets/cmd_postgres.env
    volumes:
      - /mnt/terrabud/docker-data/newport/cmd_postgres:/var/lib/postgresql/data

  # Object storage (S3-compatible) for cmd: finance source documents + the
  # docs typst import surface (Cmd.ObjectStore.S3 → http://garage:3900).
  # Internal-only (cmd_db, no published ports). rpc_secret + admin_token come
  # from the env (cmd_garage.enc.yaml), not garage.toml. The bucket + access
  # key were bootstrapped via `docker exec ... /garage {layout,bucket,key}`
  # (the distroless image has no /bin/sh); OBJECT_STORE_* live in cmd.enc.yaml.
  cmd_garage:
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    networks:
      cmd_db:
        aliases: [garage]
    env_file:
      - ./.runtime-secrets/cmd_garage.env
    volumes:
      - /mnt/terrabud/docker-data/newport/cmd_garage/meta:/var/lib/garage/meta
      - /mnt/terrabud/docker-data/newport/cmd_garage/data:/var/lib/garage/data
      - ./cmd_garage/garage.toml:/etc/garage.toml:ro

  bar:
    image: ghcr.io/jackharrhy/bar:main
    restart: unless-stopped
    networks: [web]
    labels:
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.middlewares.bar-strip-prefix.stripprefix.prefixes=/bar"
      - "traefik.http.services.bar.loadbalancer.server.port=8080"
      - "traefik.http.routers.bar.rule=(Host(`jackharrhy.dev`) && PathPrefix(`/bar`))"
      - "traefik.http.routers.bar.middlewares=bar-strip-prefix@docker"
      - "traefik.http.routers.bar.entrypoints=web"

  duaas:
    image: ghcr.io/jackharrhy/duaas:main
    restart: unless-stopped
    networks: [web]
    labels:
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.middlewares.duaas-strip-prefix.stripprefix.prefixes=/urandom"
      - "traefik.http.services.duaas.loadbalancer.server.port=8000"
      - "traefik.http.routers.duaas.rule=(Host(`jackharrhy.dev`) && PathPrefix(`/urandom`))"
      - "traefik.http.routers.duaas.middlewares=duaas-strip-prefix@docker"
      - "traefik.http.routers.duaas.entrypoints=web"

  phapbot:
    image: ghcr.io/jackharrhy/phapbot:latest
    restart: unless-stopped
    env_file:
      - ./.runtime-secrets/phapbot.env

  incydecy:
    image: ghcr.io/jackharrhy/incydecy:main
    restart: unless-stopped
    env_file:
      - ./.runtime-secrets/incydecy.env
    volumes:
      - ./volumes/incydecy:/app/data

  steve:
    image: ghcr.io/jackharrhy/tea-letters-to-steve:latest
    restart: unless-stopped
    networks: [web]
    env_file:
      - ./.runtime-secrets/steve.env
    environment:
      - DATABASE_PATH=/app/data/letters.sqlite
      - UPLOAD_DIRECTORY=/app/data/uploads
      - TRUST_PROXY=true
    volumes:
      - /mnt/terrabud/docker-data/newport/steve_tea_data:/app/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.services.steve.loadbalancer.server.port=44110"
      - "traefik.http.routers.steve.rule=Host(`steve-letter-writ.ing`)"
      - "traefik.http.routers.steve.entrypoints=web"

  notscared_site:
    image: ghcr.io/jackharrhy/notscared-site:main
    restart: unless-stopped
    networks: [web]
    labels:
      - "traefik.docker.network=newport_web"
      - "traefik.enable=true"
      - "traefik.http.services.notscared_site.loadbalancer.server.port=3000"
      - "traefik.http.routers.notscared_site.rule=Host(`notsca.red`)"
      - "traefik.http.routers.notscared_site.entrypoints=web"

  lore:
    image: ghcr.io/epicgames/lore/loreserver:0.11.0@sha256:62a6ae27091e6a525e3c078d48f81969e8b7dbedab7d4f736cacc5bb575bbae1
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "100.123.66.70:41337:41337/tcp"
      - "127.0.0.1:41339:41339/tcp"
    networks: [web]
    volumes:
      - /mnt/terrabud/docker-data/newport/lore:/data
      - ./lore/local.toml:/etc/lore/config/local.toml:ro
    labels:
      - "traefik.enable=false"
      - "com.centurylinklabs.watchtower.enable=false"

  jack-auth-db:
    image: postgres:17-alpine
    restart: unless-stopped
    networks: [jack_auth_backend]
    env_file: [./jack-auth/.runtime-secrets/postgres.env]
    volumes:
      - /mnt/terrabud/docker-data/newport/jack-auth/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U zitadel -d zitadel"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  jack-auth-api:
    image: ghcr.io/zitadel/zitadel:v4.20.0@sha256:9ea0e9ecfdc43115da871242e40a0320f2ece864c7cd8b5d41a863a7f4902499
    restart: unless-stopped
    command: [start-from-init, --masterkeyFromEnv, --tlsMode, external]
    networks: [jack_auth_backend, web]
    ports: ["100.123.66.70:18085:8080/tcp"]
    env_file: [./jack-auth/.runtime-secrets/zitadel.env]
    environment:
      ZITADEL_EXTERNALDOMAIN: auth.jackharrhy.dev
      ZITADEL_EXTERNALPORT: 443
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_SYSTEMDEFAULTS_PASSWORDHASHER_VERIFIERS: "pbkdf2"
      ZITADEL_FIRSTINSTANCE_INSTANCENAME: Jack Auth spike
      ZITADEL_FIRSTINSTANCE_ORG_NAME: Jack Auth
      ZITADEL_FIRSTINSTANCE_PATPATH: /bootstrap/owner.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Spike bootstrap owner
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2026-11-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /bootstrap/login.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: jack-auth-login
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Jack Auth login
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2026-11-25T00:00:00Z"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: https://auth.jackharrhy.dev/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: https://auth.jackharrhy.dev/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: https://auth.jackharrhy.dev/logout?post_logout_redirect=
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_ALLOWREGISTER: "false"
      ZITADEL_DEFAULTINSTANCE_RESTRICTIONS_DISALLOWPUBLICORGREGISTRATION: "true"
    volumes:
      - /mnt/terrabud/docker-data/newport/jack-auth/bootstrap:/bootstrap
    healthcheck:
      test: [CMD, /app/zitadel, ready]
      interval: 10s
      timeout: 10s
      retries: 15
    labels:
      - "traefik.enable=false"
      - "com.centurylinklabs.watchtower.enable=false"

  jack-auth-ui:
    image: jack-auth:spike
    pull_policy: never
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [jack_auth_backend, web]
    ports: ["100.123.66.70:18086:3000/tcp"]
    env_file: [./jack-auth/.runtime-secrets/ui.env]
    environment:
      FOURM_ENROLLMENT_KEY_FILE: /run/secrets/fourm-enrollment-key.json
    volumes:
      - ./jack-auth/.runtime-secrets/login-key.json:/run/secrets/login-token.json:ro
      - ./jack-auth/.runtime-secrets/management-key.json:/run/secrets/management-token.json:ro
      - ./jack-auth/.runtime-secrets/fourm-enrollment-key.json:/run/secrets/fourm-enrollment-key.json:ro
    labels:
      - "traefik.enable=false"
      - "com.centurylinklabs.watchtower.enable=false"

networks:
  jack_auth_backend:
    internal: true
  web:
  maps_backend:
    internal: true

  miniflux:
  sluggers_super_draft:
  cmd_db:
    external: true
    name: newport_cmd_db
