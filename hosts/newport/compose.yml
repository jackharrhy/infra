    env_file: [.runtime-secrets/qbittorrent-auth.env]
    ports: ["127.0.0.1:14183:4180"]
    environment:
      <<: *media-auth-environment
      OAUTH2_PROXY_REDIRECT_URL: https://qbittorrent.rotund.org/oauth2/callback
