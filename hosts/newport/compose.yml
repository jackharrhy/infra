      - "traefik.http.routers.prowlarr-oauth.rule=Host(`prowlarr.rotund.org`) && PathPrefix(`/oauth2/`)"
      - "traefik.http.routers.prowlarr-oauth.entrypoints=web"
      - "traefik.http.routers.prowlarr-oauth.service=prowlarr-auth"
      - "traefik.http.services.prowlarr-auth.loadbalancer.server.port=4180"
      - "traefik.http.middlewares.prowlarr-auth.forwardauth.address=http://127.0.0.1:14182/"
