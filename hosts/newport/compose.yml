      retries: 6
      start_period: 30s
    labels:
    - com.centurylinklabs.watchtower.enable=true
    - traefik.docker.network=newport_web
    - traefik.enable=true
    - traefik.http.services.stackcoin.loadbalancer.server.port=80
    - traefik.http.routers.stackcoin.rule=Host(`stackcoin.world`)
    - traefik.http.routers.stackcoin.entrypoints=web

  luckypot:
