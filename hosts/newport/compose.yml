    networks:
    - web
    environment:
    - NODE_ENV=production
    - DB_PATH=/app/data/burger.db
    - AUTH_ISSUER=https://auth.jackharrhy.dev
    - AUTH_CLIENT_ID=398737918404919299
    - AUTH_PROJECT_ID=398737915301068803
    - BURGER_URL=https://big.burger.beauty
    volumes:
    - /mnt/terrabud/docker-data/newport/burger_data:/app/data
    labels:
    - com.centurylinklabs.watchtower.enable=true
    - traefik.docker.network=newport_web
    - traefik.enable=true
    - traefik.http.services.burger.loadbalancer.server.port=5000
    - traefik.http.routers.burger.rule=Host(`big.burger.beauty`)
    - traefik.http.routers.burger.entrypoints=web

