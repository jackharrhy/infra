http:
  routers:
    jack-auth-ui:
      rule: "Host(`auth.jackharrhy.dev`) && (Path(`/`) || PathPrefix(`/login`) || PathPrefix(`/device`) || PathPrefix(`/account`) || Path(`/manage`) || PathPrefix(`/manage/`) || PathPrefix(`/authorize`) || PathPrefix(`/logout`) || PathPrefix(`/assets/`) || Path(`/healthz`) || Path(`/forgot-password`) || Path(`/reset-password`) || Path(`/verify-email`))"
      priority: 200
      entryPoints: [websecure]
      service: jack-auth-ui
      tls: {certResolver: mugresolver}
    jack-auth-api:
      rule: "Host(`auth.jackharrhy.dev`)"
      priority: 100
      entryPoints: [websecure]
      service: jack-auth-api
      tls: {certResolver: mugresolver}
  services:
    jack-auth-ui:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://newport.hedgehog-python.ts.net:18086"
    jack-auth-api:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "h2c://newport.hedgehog-python.ts.net:18085"
